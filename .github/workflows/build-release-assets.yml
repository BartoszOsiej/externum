name: build-release-assets

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python3 -m build
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            LICENSE
          generate_release_notes: true
