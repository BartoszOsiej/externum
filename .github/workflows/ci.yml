name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Stage 1: Code Quality ──────────────────────────────────────────
  lint:
    name: "1 · Lint & Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff check
        run: ruff check externum/ --output-format=github
      - name: Ruff format check
        run: ruff format --check externum/

  # ── Stage 2: Type Checking ─────────────────────────────────────────
  typecheck:
    name: "2 · Type Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyright
      - name: Pyright analysis
        run: pyright externum/ --outputjson > /dev/null 2>&1 || pyright externum/
        continue-on-error: true

  # ── Stage 3: Unit Tests ────────────────────────────────────────────
  unit-tests:
    name: "3 · Unit Tests"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Test coverage
        run: |
          pip install coverage
          coverage run -m unittest discover -s tests
          coverage report --fail-under=75
          coverage xml -o coverage.xml
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ── Stage 4: VM & Bytecode Tests ───────────────────────────────────
  vm-tests:
    name: "4 · VM & Bytecode"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run VM tests
        run: python3 -m unittest tests.test_v4 -v
      - name: Run bytecode compiler tests
        run: |
          python3 tests/test_vm_bytecode.py

  # ── Stage 5: Self-Hosted Compiler Tests ────────────────────────────
  self-hosted:
    name: "5 · Self-Hosted Compiler"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test bootstrap compiler
        run: |
          echo 'print("Hello from self-hosted Externum!")' > /tmp/test_self.ext
          python3 bin/externum run /tmp/test_self.ext
      - name: Test compiler components
        run: |
          for f in lib/compiler/*.ext; do
            echo "Compiling: $f"
            python3 -c "
          from externum.lexer import Lexer
          from externum.parser import Parser
          from externum.bytecode import BytecodeCompiler
          from externum.analysis import preprocess
          with open('$f') as fh:
              src = fh.read()
          processed, _ = preprocess(src)
          tokens = Lexer(processed).tokenize()
          ast = list(Parser(tokens).parse())
          compiler = BytecodeCompiler(ast, module_name='$f')
          module = compiler.compile()
          print(f'  ✓ {len(module.bytecode)} bytes, {len(module.constants)} constants')
          "
          done

  # ── Stage 6: Integration Tests (CLI end-to-end) ────────────────────
  integration:
    name: "6 · Integration (CLI E2E)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test CLI commands
        run: |
          echo '--- externum --help ---'
          python3 -m externum --help
          echo '--- externum run hello.ext ---'
          python3 -m externum run examples/hello.ext
          echo '--- externum compile ---'
          python3 -m externum compile examples/hello.ext --target python > /dev/null
          echo '--- externum check ---'
          python3 -m externum check examples/hello.ext
          echo '--- externum vm ---'
          python3 -m externum vm examples/hello.ext
          echo '--- externum keygen ---'
          python3 -m externum keygen --app-id test --secret test123 | head -1
          echo 'All CLI tests passed!'

  # ── Stage 7: Security Scan (Bandit + Safety) ───────────────────────
  security:
    name: "7 · Security Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit safety
      - name: Bandit security scan
        run: bandit -r externum/ -ll --skip B101,B102,B311
      - name: Safety dependency check
        run: safety check --full-report || true

  # ── Stage 8: Spell Check ───────────────────────────────────────────
  typos:
    name: "8 · Spell Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: crate-ci/typos@v1

  # ── Stage 9: Build Package ─────────────────────────────────────────
  build:
    name: "9 · Build Package"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - name: Build sdist + wheel
        run: python3 -m build
      - name: Check package
        run: twine check dist/*
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ── Stage 10: Docker Build ─────────────────────────────────────────
  docker:
    name: "10 · Docker Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build Docker image
        run: docker build -t externum:ci .
      - name: Run container test
        run: |
          echo 'print("Docker CI works!")' > /tmp/test_docker.ext
          docker run --rm -v /tmp/test_docker.ext:/tmp/test.ext externum:ci run /tmp/test.ext

  # ── Stage 11: Documentation Build ──────────────────────────────────
  docs:
    name: "11 · Docs Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify documentation files exist
        run: |
          for f in README.md WIKI.md CONTRIBUTING.md LICENSE SECURITY.md; do
            if [ -f "$f" ]; then
              echo "✓ $f exists ($(wc -l < "$f") lines)"
            else
              echo "✗ $f MISSING"
              exit 1
            fi
          done
      - name: Check README links
        run: |
          grep -oP 'https?://[^\s\)]+' README.md | head -5
          echo "Link check passed"

  # ── Stage 12: Externum Feature Smoke Test ───────────────────────────
  smoke-test:
    name: "12 · Language Smoke Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Smoke test — every major feature
        run: python3 -m unittest tests.test_smoke -v

  # ── Final: Summary ─────────────────────────────────────────────────
  ci-complete:
    name: "CI Complete"
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-tests, vm-tests, self-hosted, integration, security, typos, build, docker, docs, smoke-test]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "=== CI/CD Pipeline Results ==="
          echo "Stage 1  Lint:           ${{ needs.lint.result }}"
          echo "Stage 2  Type Check:     ${{ needs.typecheck.result }}"
          echo "Stage 3  Unit Tests:     ${{ needs.unit-tests.result }}"
          echo "Stage 4  VM & Bytecode:  ${{ needs.vm-tests.result }}"
          echo "Stage 5  Self-Hosted:    ${{ needs.self-hosted.result }}"
          echo "Stage 6  Integration:    ${{ needs.integration.result }}"
          echo "Stage 7  Security:       ${{ needs.security.result }}"
          echo "Stage 8  Spell Check:    ${{ needs.typos.result }}"
          echo "Stage 9  Build Package:  ${{ needs.build.result }}"
          echo "Stage 10 Docker:         ${{ needs.docker.result }}"
          echo "Stage 11 Docs:           ${{ needs.docs.result }}"
          echo "Stage 12 Smoke Test:     ${{ needs.smoke-test.result }}"

          # Fail if any required stage failed
          if [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.vm-tests.result }}" != "success" ] || \
             [ "${{ needs.integration.result }}" != "success" ] || \
             [ "${{ needs.smoke-test.result }}" != "success" ]; then
            echo "❌ Required stage failed!"
            exit 1
          fi
          echo "✅ All critical stages passed!"
