name: VHS TUI Demos

on:
  push:
    branches: [main]
    paths: ['**/*.vhs', '.github/workflows/vhs.yml']
  workflow_dispatch:
permissions: read-all

jobs:
  render:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install VHS
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg ttyd
          curl -sLO https://github.com/charmbracelet/vhs/releases/download/v0.11.0/vhs_0.11.0_Linux_x86_64.tar.gz
          tar xzf vhs_0.11.0_Linux_x86_64.tar.gz --strip-components=1
          sudo mv vhs /usr/local/bin/
          vhs --version

      - name: Install Externum
        run: pip install -e .

      - name: Render .vhs tapes to GIF
        run: |
          mkdir -p assets
          for tape in demos/*.vhs; do
            name=$(basename "$tape" .vhs)
            vhs "$tape" -o "assets/${name}.gif"
            echo "Rendered: assets/${name}.gif"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vhs-demos
          path: assets/*.gif
          retention-days: 30

      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.gif
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: re-render VHS demos [skip ci]"
            git pull --rebase --autostash https://x-access-token:${{ secrets.PUSH_TOKEN }}@github.com/${{ github.repository }}.git main
            git push https://x-access-token:${{ secrets.PUSH_TOKEN }}@github.com/${{ github.repository }}.git
          fi