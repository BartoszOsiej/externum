name: Deploy Playground (Pages)

on:
  push:
    branches: [main]
    paths: ["docs/**", "externum/**", "lib/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bundle live language sources into the site
        run: |
          mkdir -p docs/externum-live/externum/runtime docs/externum-live/lib
          cp externum/__init__.py externum/lexer.py externum/parser.py externum/compiler.py docs/externum-live/externum/
          cp externum/runtime/__init__.py docs/externum-live/externum/runtime/
          cp lib/*.ext docs/externum-live/lib/
          find docs -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
