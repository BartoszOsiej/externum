name: Deploy Playground (Pages)

on:
  push:

permissions: read-all

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Bundle live language sources into the site
        run: |
          mkdir -p docs/externum-live/externum/runtime docs/externum-live/lib
          cp externum/__init__.py externum/lexer.py externum/parser.py externum/compiler.py docs/externum-live/externum/
          cp externum/runtime/__init__.py docs/externum-live/externum/runtime/
          cp lib/*.ext docs/externum-live/lib/
          find docs -type f | sort

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: docs

  deploy:
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
