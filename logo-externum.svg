<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Externum logo v4</title>
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.38" r="0.85">
      <stop offset="0" stop-color="#262056"/>
      <stop offset="0.6" stop-color="#171338"/>
      <stop offset="1" stop-color="#070614"/>
    </radialGradient>
    <linearGradient id="inb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#CBD5E1" stop-opacity="0"/>
      <stop offset="1" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="py" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A5F3FC"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="bc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DDD6FE"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#F8FAFC" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#F8FAFC" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#A5B4FC" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="g4"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="g10"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="g2"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>

  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bg)"/>
  <rect x="18.5" y="18.5" width="219" height="219" rx="50" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1.5"/>

  <!-- aurora, contained -->
  <ellipse cx="118" cy="112" rx="70" ry="48" fill="#4F46E5" opacity="0.18" filter="url(#g10)"/>
  <ellipse cx="150" cy="132" rx="46" ry="34" fill="#0EA5E9" opacity="0.10" filter="url(#g10)"/>

  <!-- input beam: fades in from empty, stops exactly at prism wall -->
  <line x1="52" y1="120" x2="103" y2="120" stroke="url(#inb)" stroke-width="7" stroke-linecap="round" filter="url(#g4)" opacity="0.85"/>
  <line x1="52" y1="120" x2="103" y2="120" stroke="url(#inb)" stroke-width="3.4" stroke-linecap="round"/>

  <!-- prism: fully inside, breathing room on all sides -->
  <polygon points="128,72 168,148 88,148" fill="url(#glass)" stroke="#EEF2FF" stroke-opacity="0.8" stroke-width="3.4" stroke-linejoin="round"/>
  <polygon points="128,72 168,148 88,148" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.1" stroke-linejoin="round" transform="translate(-2.5,-2.5)"/>
  <path d="M119 88 L133 88 L112 122 L102 122 Z" fill="#FFFFFF" opacity="0.15" filter="url(#g4)"/>

  <!-- dispersion: start on the right wall, converge slightly then fan out -->
  <g filter="url(#g4)">
    <line x1="154" y1="116" x2="196" y2="96"  stroke="url(#py)" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
    <line x1="156" y1="124" x2="198" y2="124" stroke="url(#sh)" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
    <line x1="154" y1="132" x2="196" y2="152" stroke="url(#bc)" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  </g>
  <g>
    <line x1="154" y1="116" x2="196" y2="96"  stroke="url(#py)" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="156" y1="124" x2="198" y2="124" stroke="url(#sh)" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="154" y1="132" x2="196" y2="152" stroke="url(#bc)" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <!-- beam tips: small bright cores, not clipped -->
  <circle cx="198" cy="96"  r="3" fill="#A5F3FC"/>
  <circle cx="200" cy="124" r="3" fill="#FDE68A"/>
  <circle cx="198" cy="152" r="3" fill="#DDD6FE"/>

  <!-- subtle floor glow, not a mirror -->
  <ellipse cx="128" cy="188" rx="52" ry="9" fill="#4F46E5" opacity="0.14" filter="url(#g10)"/>
</svg>
