<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Externum logo</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="in" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64748B"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bg)"/>
  <!-- input beam -->
  <line x1="44" y1="128" x2="112" y2="128" stroke="url(#in)" stroke-width="9" stroke-linecap="round"/>
  <!-- prism -->
  <polygon points="128,84 168,172 88,172" fill="none" stroke="#E2E8F0" stroke-width="8" stroke-linejoin="round"/>
  <!-- output beams: python / bash / bytecode -->
  <line x1="142" y1="122" x2="214" y2="86"  stroke="#22D3EE" stroke-width="8" stroke-linecap="round"/>
  <line x1="144" y1="132" x2="216" y2="132" stroke="#F59E0B" stroke-width="8" stroke-linecap="round"/>
  <line x1="142" y1="142" x2="214" y2="178" stroke="#A78BFA" stroke-width="8" stroke-linecap="round"/>
</svg>
